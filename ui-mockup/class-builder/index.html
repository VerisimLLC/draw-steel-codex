<meta charset="utf-8">
<title>Class Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono&display=swap">
<style>
/* Class builder prototype: board of level lanes (left) | shelf of ready-made features and sentences |
   book page, saved data. Dark only, like DMHub and the ability editor it opens. */
:root {
  color-scheme: dark;
  --bg: #121110; --dlg: #1c1a17; --panel: #24211c; --line: #3b352b;
  --fg: #ede5d5; --dim: #a3998a; --gold: #cca350; --err: #e2685a; --warn: #e0a040; --ok: #7cc28a;
  --c-stats: #3c5fa8; --c-rolls: #7d4aa3; --c-def: #2f6f6a; --c-abil: #b36125; --c-skill: #9a6d1c;
  --c-res: #8a6a20; --c-rem: #6b6258; --c-if: #b05a24; --c-test: #2c7391; --c-num: #3c8656; --c-adv: #5b564e; --c-cond: #8e3f86;
  --c-choice: #3d7a3a; --c-mine: #7a4f8f; --c-grow: #8f3a2e; --c-area: #8b5434; --c-head: #8c6a24;
  --card-bg: #fdfcf8; --card-fg: #141414;
  --font-ui: "Inter", system-ui, sans-serif; --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-card: "Bitter", Georgia, serif; --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font-ui); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.app { max-width: 1500px; margin: 0 auto; padding-block: 14px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; background: var(--dlg); border: 1px solid var(--line); border-radius: 6px 6px 0 0; }
.top h1 { font: 600 15px var(--font-head); margin: 0; letter-spacing: .02em; }
.top .spacer { flex: 1; }
.top .note { color: var(--dim); }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--gold); }
.btn.primary { border-color: var(--gold); color: var(--gold); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.link { background: none; border: none; color: var(--dim); text-decoration: underline; padding: 2px 4px; }
select.btn { max-width: 100%; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); cursor: pointer; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) 250px 380px; background: var(--dlg); border: 1px solid var(--line); border-top: none; border-radius: 0 0 6px 6px; }
.board { padding: 12px 14px 30px; min-width: 0; }
.shelf { border-left: 1px solid var(--line); padding: 10px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.side { border-left: 1px solid var(--line); padding: 10px 12px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; min-width: 0; }
@media (max-width: 1250px) {
  .body { grid-template-columns: minmax(0, 1fr) 240px; }
  .side { grid-column: 1 / span 2; position: static; max-height: none; border-left: none; border-top: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .shelf { position: static; max-height: none; border-left: none; border-top: 1px solid var(--line); order: 2; }
  .side { grid-column: 1; order: 3; }
  .lane { grid-template-columns: minmax(0, 1fr) !important; }
}
h3.sec { margin: 14px 0 6px; font: 600 11px var(--font-head); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); display: flex; align-items: center; gap: 8px; }
h3.sec:first-child { margin-top: 2px; }
.hint { color: var(--dim); font-size: 12px; margin: 4px 0; }
.mono { font-family: var(--font-mono); font-size: 11.5px; }

/* Class header and the two fixed cards (Basics, Heroic resource) */
.clsname { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.clsname input { background: none; border: none; border-bottom: 1px dashed var(--line); font: 600 22px var(--font-head); padding: 2px 0; min-width: 0; width: 260px; max-width: 100%; }
.clsname input:focus { border-bottom-color: var(--gold); outline: none; }
textarea.details { width: 100%; min-height: 54px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; resize: vertical; color: var(--fg); }
/* Basics and the resource name read as header blocks, like "What is it" in the ability editor. */
.fixed { display: flex; flex-direction: column; margin-top: 6px; }
.fixed .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; background: var(--c-head); color: #fff; border: 1px solid rgba(0,0,0,.35); border-top: none; padding: 7px 10px; }
.fixed .row:first-child { border-top: 1px solid rgba(0,0,0,.35); border-radius: 4px 4px 0 0; }
.fixed .row:last-child { border-radius: 0 0 4px 4px; }
.fixed .row:only-child { border-radius: 4px; }
.fixed .lbl { color: rgba(255,255,255,.72); min-width: 104px; }

/* Underlined values: each opens one control (inline select / input). */
.tok { border-bottom: 1px dotted rgba(255,255,255,.8); padding: 0 1px; cursor: pointer; font-weight: 600; background: none; border-top: none; border-left: none; border-right: none; border-radius: 0; color: inherit; }
.tok:hover, .tok:focus-visible { background: rgba(255,255,255,.16); outline: none; border-bottom-style: solid; }
.tok.empty { opacity: .7; font-style: italic; font-weight: 500; }
.edit-in { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.5); border-radius: 3px; padding: 1px 4px; color: #fff; max-width: 100%; }
select.edit-in option { background: var(--dlg); color: var(--fg); }

/* Lanes */
.lanes-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 6px; }
.lane { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; border: 1px solid var(--line); border-radius: 6px; background: color-mix(in srgb, var(--panel) 60%, var(--dlg)); padding: 8px; margin-bottom: 6px; }
.lane.drop { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--dlg)); }
.lane .ln { font: 600 11px var(--font-head); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.lane .ln b { display: block; font: 600 20px var(--font-head); color: var(--fg); letter-spacing: 0; text-transform: none; }
.lane .ln small { display: block; text-transform: none; letter-spacing: 0; font: 400 11px var(--font-ui); margin-top: 2px; }
.lane .items { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 4px; padding: 5px 9px; cursor: pointer; max-width: 100%; text-align: left; }
.chip:hover { border-color: var(--gold); }
.chip .kind { font: 600 9.5px var(--font-head); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.chip .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.changed .nm::after { content: " \2022"; color: var(--ok); }
.chip.adv { border-left-color: var(--c-adv); }
.chip.adv .kind { color: var(--dim); }
.chip.dragging { opacity: .4; }
.addf { background: none; border: 1px dashed var(--line); border-radius: 4px; color: var(--dim); padding: 5px 9px; cursor: pointer; font-size: 12px; }
.addf:hover { color: var(--gold); border-color: var(--gold); }
.collapsed-note { color: var(--dim); border: 1px dashed var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; background: none; width: 100%; text-align: left; }

/* An open feature: name, book text, then what it does (sentence blocks). */
.feat { flex: 1 1 100%; min-width: 0; border: 1px solid var(--gold); border-left: 3px solid var(--gold); border-radius: 6px; background: var(--dlg); padding: 8px 10px 10px; }
.feat-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.feat-head .kind { font: 600 10px var(--font-head); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.feat-head input.fname { flex: 1 1 200px; min-width: 0; background: none; border: none; border-bottom: 1px dashed var(--line); font: 600 15px var(--font-head); padding: 2px 0; }
.feat-head input.fname:focus { outline: none; border-bottom-color: var(--gold); }
.feat textarea.ftext { width: 100%; min-height: 46px; margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; resize: vertical; font: 13.5px/1.45 var(--font-card); color: var(--fg); }
.lbl2 { font: 600 10.5px var(--font-head); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 8px 0 4px; }
.sents { display: flex; flex-direction: column; gap: 4px; }
.sent { --c: var(--c-adv); background: var(--c); color: #fff; border: 1px solid rgba(0,0,0,.35); border-radius: 4px; padding: 6px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 5px; position: relative; }
.sent.drop-target { outline: 2px dashed var(--gold); }
.sent .grow { flex: 1; }
.sent .mb { background: rgba(0,0,0,.25); border: none; border-radius: 3px; color: #fff; cursor: pointer; padding: 0 6px; }
.sent .saves { flex-basis: 100%; font: 11px var(--font-mono); opacity: .8; white-space: pre-wrap; word-break: break-word; }
.sent .tag { font: 600 9.5px var(--font-head); letter-spacing: .08em; text-transform: uppercase; background: rgba(0,0,0,.3); border-radius: 3px; padding: 1px 5px; }
.sent.ifwrap { --c: var(--c-if); flex-direction: column; align-items: stretch; }
.sent .ifline { display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center; }
.sent .ifbody { background: rgba(0,0,0,.25); border-radius: 4px; padding: 4px; display: flex; flex-direction: column; gap: 4px; }
.addsent { background: none; border: 1px dashed var(--line); border-radius: 4px; color: var(--dim); padding: 5px 9px; cursor: pointer; text-align: left; font-size: 12px; }
.addsent:hover { color: var(--gold); border-color: var(--gold); }
.addsent.inblock { color: #fff; border-color: rgba(255,255,255,.55); flex-basis: 100%; }
.addsent.inblock:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,.1); }
.sent .aside { opacity: .75; font-size: 12px; }
.saves-type { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.feat-foot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.feat-foot .spacer { flex: 1; }
/* A feature drawn as a block, in the colour of its first block (featColor). */
.chip.blockchip { background: var(--c); color: #fff; border: 1px solid rgba(0,0,0,.35); border-left: 1px solid rgba(0,0,0,.35); }
.chip.blockchip:hover { filter: brightness(1.12); border-color: rgba(255,255,255,.5); }
.chip.blockchip .grip { opacity: .7; display: inline-flex; }
.chip.blockchip.bad { box-shadow: inset 0 0 0 2px var(--err); }
.chip.blockchip.bad .nm::after { color: #fff; }
.feat { border-color: var(--c, var(--gold)); border-left-color: var(--c, var(--gold)); }
.feat-head.blockhead { background: var(--c); border-radius: 4px; padding: 6px 8px; margin: -2px -4px 4px; }
.feat-head.blockhead input.fname { color: #fff; border-bottom-color: rgba(255,255,255,.45); }
.feat-head.blockhead input.fname::placeholder { color: rgba(255,255,255,.7); }
.feat-head.blockhead input.fname:focus { border-bottom-color: #fff; }
/* "N things to finish" on an ability card: readable on any block colour. */
.warnpill { display: inline-flex; align-items: center; gap: 5px; background: rgba(0,0,0,.55); color: #fff; border-radius: 999px; padding: 2px 9px 2px 3px; font-size: 12px; font-weight: 600; }
.warnpill::before { content: "!"; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; }
.warn { color: var(--warn); font-size: 12px; }
.okline { color: var(--ok); font-size: 12px; }

/* Ability cards inside features (book style) */
.cards { display: flex; flex-wrap: wrap; gap: 8px; }
.cardwrap { flex: 1 1 260px; max-width: 360px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cardwrap .cbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.card { background: var(--card-bg); color: var(--card-fg); border-radius: 4px; padding: 10px 12px; font: 13px/1.4 var(--font-card); cursor: pointer; }
.card:hover { box-shadow: 0 0 0 2px var(--gold); }
.card h4 { margin: 0; font: 700 15.5px/1.25 var(--font-card); }
.card .fl { font-style: italic; border-bottom: 1px solid var(--card-fg); padding-bottom: 3px; margin-top: 1px; }
.card .kr, .card .dr { display: flex; justify-content: space-between; gap: 10px; }
.card .kr { font-weight: 700; margin-top: 2px; }
.card .pr { font-weight: 700; margin-top: 6px; }
.card .tr { display: grid; grid-template-columns: 40px 1fr; gap: 6px; margin-top: 2px; }
.card .tr .n { font: 600 10px/16px var(--font-card); border: 1px solid var(--card-fg); border-radius: 2px; text-align: center; height: 17px; }
.card .ef { margin-top: 6px; white-space: pre-wrap; }
.card .ef b { font-weight: 700; }
.card.trig { border-left: 4px solid #b36125; }

/* Shelf */
.shelf input.search { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
.shelf h4 { margin: 4px 0 0; font: 600 11px var(--font-head); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); display: flex; justify-content: space-between; }
.rm { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 4px; padding: 6px 8px; cursor: grab; }
.rm:hover { border-color: var(--gold); }
.rm .t { display: flex; justify-content: space-between; font-weight: 600; }
.rm .t span { color: var(--dim); font-weight: 400; font-size: 11.5px; }
.rm .d { color: var(--dim); font-size: 11.5px; }
.sb { --c: var(--c-adv); display: flex; justify-content: space-between; width: 100%; text-align: left; background: var(--c); color: #fff; border: 1px solid rgba(0,0,0,.35); border-radius: 4px; padding: 5px 8px; cursor: grab; font-size: 12.5px; }
.sb:hover { filter: brightness(1.15); }
.sb[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.sb span { opacity: .75; font-size: 11.5px; }

/* Side: saved data */
pre.saved { font: 11px var(--font-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; white-space: pre-wrap; word-break: break-word; max-height: 70vh; overflow: auto; }
.rt { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; }
.rt.ok { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }

/* Popups and the ability editor modal */
/* Logic tests: hexagon chips, as in the ability editor. */
.empty-test { display: inline-flex; align-items: center; height: 24px; padding: 0 16px; cursor: pointer; color: #fff; background: rgba(0,0,0,.25); border: none; font-size: 12px; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); }
.empty-test:hover, .empty-test:focus-visible { background: rgba(0,0,0,.45); outline: none; }
.empty-test.required { background: color-mix(in srgb, var(--err, #e2685a) 55%, rgba(0,0,0,.3)); }
.x { position: relative; display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; color: #fff; background: var(--c-test); min-height: 24px; padding: 2px 16px; max-width: 100%; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); }
.x .x { min-height: 22px; background: color-mix(in srgb, var(--c-test) 80%, #fff); }
.x.list { clip-path: none; border-radius: 6px; flex-direction: column; align-items: flex-start; padding: 4px 8px; gap: 3px; }
.x.list .listhead { font-weight: 600; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.x.list .item { display: flex; align-items: center; gap: 5px; }
.x.list .bullet { opacity: .7; font-size: 11px; }
.x .clear { display: none; background: rgba(0,0,0,.25); border: none; color: #fff; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; line-height: 1; cursor: pointer; padding: 0; }
.x:hover > .clear, .x:focus-within > .clear, .x.list:hover > .listhead > .clear, .x.list:focus-within > .listhead > .clear { display: inline-block; }
.x .clear:hover { background: var(--err, #e2685a); }
.x .addtest { background: rgba(0,0,0,.25); border: none; color: #fff; border-radius: 3px; font-size: 11.5px; padding: 1px 8px; cursor: pointer; }
.menu.picker { width: 380px; max-width: calc(100vw - 32px); max-height: 470px; display: flex; flex-direction: column; padding: 0; }
.menu.picker .ph { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.menu.picker .ph .t { font: 600 13px var(--font-head); }
.menu.picker .ph p { margin: 4px 0 8px; color: var(--dim); font-size: 12px; line-height: 1.4; }
.menu.picker .ph input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; box-sizing: border-box; color: var(--fg); }
.menu.picker .pb { overflow-y: auto; padding: 6px 6px 10px; }
.menu.picker .grp { font: 600 12.5px var(--font-head); color: var(--gold); padding: 10px 6px 3px; display: flex; flex-direction: column; gap: 1px; }
.menu.picker .grp .gd { font: 400 11.5px var(--font-ui, inherit); color: var(--dim); }
.menu.picker .opt { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; }
.menu.picker .opt .chip { flex: none; display: inline-block; padding: 2px 12px; color: #fff; font-size: 11.5px; background: var(--c-test); clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 7px 100%, 0 50%); }
.menu.picker .opt .chip.num { background: var(--c-num); clip-path: none; border-radius: 999px; padding: 2px 9px; }
.menu.picker .ph .t .kind { font: 500 10px var(--font-ui, inherit); text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; margin-left: 8px; border-radius: 3px; background: var(--panel); color: var(--dim); }
.menu.picker .typebox .btn { width: auto; border: 1px solid var(--line); background: var(--panel); }
.menu.picker .opt .chip { border: none; }
.menu.picker .typebox .res { font-size: 11.5px; margin: 4px 0; color: var(--dim); }
.menu.picker .opt.more { color: var(--gold); font-size: 12px; padding-left: 10px; }
.menu.picker .opt .d { color: var(--dim); font-size: 11.5px; line-height: 1.3; }
.menu.picker .note { color: var(--dim); font-size: 12px; padding: 6px; }
.gsdoc { position: fixed; inset: 16px; z-index: 300; display: flex; flex-direction: column; background: var(--dlg); border: 1px solid var(--gold); border-radius: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
.gsdoc-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.gsdoc iframe { flex: 1; width: 100%; border: none; border-radius: 0 0 6px 6px; background: var(--bg); }
.doclink { background: none; border: none; padding: 0; margin: 6px 0 2px; color: var(--gold); cursor: pointer; font-size: 12px; text-decoration: underline; }
.menu.picker .typebox { border-top: 1px solid var(--line); padding: 8px 12px 10px; }
.menu.picker .typebox summary { cursor: pointer; color: var(--dim); font-size: 12px; }
.menu.picker .typebox textarea { width: 100%; box-sizing: border-box; margin: 6px 0; min-height: 48px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px; font: 12px var(--font-mono); color: var(--fg); }
.tok.arrays { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; border-bottom: none; }
.tok.arrays .arr { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 1px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; word-spacing: 3px; }
.tok.arrays:hover .arr { border-color: #fff; }
.tok.arrays .arrtag { font-size: 11px; opacity: .8; font-style: italic; }
.menu { position: absolute; z-index: 50; background: var(--dlg); border: 1px solid var(--gold); border-radius: 6px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: min(360px, calc(100vw - 32px)); max-height: 60vh; overflow-y: auto; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; }
.menu button:hover { background: var(--panel); }
.menu h5 { margin: 6px 6px 2px; font: 600 10.5px var(--font-head); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.menu .multi label { display: flex; gap: 6px; align-items: center; padding: 2px 6px; cursor: pointer; }
.menu input.filter { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; margin-bottom: 4px; }

.menu textarea.io { width: min(520px, calc(100vw - 64px)); height: 220px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; font: 11px var(--font-mono); color: var(--fg); padding: 6px; }
