<title>Simple Ability Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: editor dialog -- block stack (left, the ability top to bottom) | live ability card (right).
   Dark only, to match DMHub. Shape = value type (round number, pointed test); category = hue + label. */
:root {
  color-scheme: dark;
  --bg: #121110;
  --dlg: #1c1a17;
  --panel: #24211c;
  --line: #3b352b;
  --fg: #ede5d5;
  --dim: #a3998a;
  --gold: #cca350;
  --err: #e2685a;
  --warn: #e0a040;
  --ok: #7cc28a;
  --c-head: #8c6a24;
  --c-roll: #7d4aa3;
  --c-act: #a33d4b;
  --c-ctrl: #b36125;
  --c-num: #3c8656;
  --c-test: #2c7391;
  --c-raw: #5b564e;
  --card-bg: #f3ecdc;
  --card-fg: #2a2418;
  --card-rule: #b9a27a;
  --font-ui: "Inter", system-ui, sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-card: "Alegreya Sans", "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.35 var(--font-ui); }
.page { padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

.dlg { max-width: 1120px; margin: 0 auto; background: var(--dlg); border: 1px solid var(--line); border-radius: 6px; }
.dlg-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dlg-head h1 { font: 600 15px var(--font-head); margin: 0; letter-spacing: .02em; }
.dlg-head .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: none; padding: 5px 10px; cursor: pointer; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--gold); }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--gold); }
.btn.link { background: none; border: none; color: var(--dim); text-decoration: underline; padding: 4px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); cursor: pointer; }
.dlg-body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
@media (max-width: 860px) { .dlg-body { grid-template-columns: 1fr; } .side { border-left: none !important; border-top: 1px solid var(--line); } }
.main { padding: 16px; min-width: 0; overflow-x: auto; }
.side { border-left: 1px solid var(--line); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

/* ---------- stack ---------- */
.stack { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.step { position: relative; color: #fff; --c: var(--c-raw); }
.step > .bar, .step > .mouth > .spine, .step > .foot, .step > .mid { background: var(--c); }
.step > .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 7px 8px 7px 4px; border-radius: 4px; border: 1px solid rgba(0,0,0,.35); min-height: 36px; }
.step.c > .bar { border-radius: 4px 4px 0 4px; }
.step + .step, .step + .addrow { margin-top: 3px; }
.step > .mid { padding: 4px 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; border-left: 1px solid rgba(0,0,0,.35); border-right: 1px solid rgba(0,0,0,.35); display: flex; gap: 8px; align-items: baseline; }
.step > .mid .range { font-family: var(--font-mono); font-weight: 400; opacity: .85; }
.step > .mouth { display: flex; }
.step > .mouth > .spine { width: 16px; flex: none; border-left: 1px solid rgba(0,0,0,.35); }
.step > .mouth > .inner { flex: 1; min-width: 0; padding: 4px 0 4px 6px; background: color-mix(in srgb, var(--c) 10%, transparent); }
.step > .foot { height: 12px; width: 70px; border-radius: 0 0 4px 4px; border: 1px solid rgba(0,0,0,.35); border-top: none; }
.cat-head { --c: var(--c-head); }
.cat-roll { --c: var(--c-roll); }
.cat-act { --c: var(--c-act); }
.cat-ctrl { --c: var(--c-ctrl); }
.cat-raw { --c: var(--c-raw); }
.step.cat-raw > .bar { background: repeating-linear-gradient(135deg, var(--c-raw) 0 10px, #545049 10px 20px); }
.adv-tag { font: 600 10px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; background: rgba(0,0,0,.35); padding: 3px 6px; border-radius: 3px; }
.full-btn { background: rgba(255,255,255,.92); color: #1b1712; border: none; border-radius: 4px; height: 22px; padding: 0 8px; cursor: pointer; font-size: 12px; }
.full-btn:hover { background: #fff; }
.handle { cursor: grab; width: 18px; align-self: stretch; display: grid; place-items: center; opacity: .7; touch-action: none; user-select: none; flex: none; }
.handle:hover { opacity: 1; }
.handle svg { width: 10px; height: 14px; fill: currentColor; }
.menu-btn { margin-left: auto; background: rgba(0,0,0,.18); border: none; border-radius: 3px; width: 24px; height: 22px; cursor: pointer; color: #fff; line-height: 1; }
.menu-btn:hover { background: rgba(0,0,0,.35); }
.lbl { white-space: nowrap; }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; opacity: .8; margin-right: 2px; }
.drop-line { height: 4px; background: #fff; border-radius: 2px; box-shadow: 0 0 6px #fff; margin: 2px 0; }
.step.ghost { opacity: .35; }

.addrow { display: flex; }
.add-btn { background: none; border: 1px dashed var(--line); color: var(--dim); border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
.add-btn:hover { border-color: var(--gold); color: var(--gold); }
.inner .add-btn { border-color: rgba(255,255,255,.25); }

.section-title { font: 600 11px var(--font-head); text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 18px 0 6px; display: flex; align-items: center; gap: 8px; }
.section-title:first-child { margin-top: 0; }
.section-title .hint { text-transform: none; letter-spacing: 0; font: 400 12px var(--font-ui); color: var(--dim); opacity: .8; }

/* inline fields on blocks */
.f { background: rgba(255,255,255,.93); color: #1b1712; border: none; border-radius: 4px; height: 22px; padding: 0 6px; font-size: 12.5px; field-sizing: content; min-width: 30px; }
input.f { border-radius: 999px; padding: 0 9px; }
input.f.num { min-width: 34px; text-align: center; }
input.f.name { min-width: 120px; font-weight: 600; }

/* ---------- formula holders ---------- */
.holder { display: inline-flex; align-items: center; gap: 3px; position: relative; max-width: 100%; }
.holder.hot > * { outline: 2px solid #fff; outline-offset: 2px; }
.fx { background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 999px; height: 22px; padding: 0 7px; cursor: pointer; font: italic 600 12px Georgia, serif; }
.fx:hover { background: rgba(0,0,0,.4); }
.empty-test { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 16px; cursor: pointer; color: #fff; background: rgba(0,0,0,.25); border: none; font-size: 12px; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); }
.empty-test:hover { background: rgba(0,0,0,.45); }
.empty-test.required { background: color-mix(in srgb, var(--err) 55%, rgba(0,0,0,.3)); }
.gs-line { display: block; font: 11px var(--font-mono); font-variant-ligatures: none; color: #fff; opacity: .78; padding: 3px 0 0 22px; word-break: break-word; }
.show-gs-off .gs-line { display: none; }

.x { --c: var(--c-num); position: relative; display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; color: #fff; background: var(--c); border: 1px solid rgba(0,0,0,.35); min-height: 24px; padding: 2px 8px; max-width: 100%; }
.x.num { border-radius: 999px; }
.x.test { --c: var(--c-test); border: none; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); padding: 2px 16px; }
.x.raw { --c: var(--c-raw); font-family: var(--font-mono); font-size: 11.5px; }
.x .x { min-height: 22px; }
.x.list { clip-path: none; border-radius: 6px; flex-direction: column; align-items: flex-start; padding: 4px 8px 4px 8px; gap: 3px; }
.x.list .listhead { font-weight: 600; font-size: 11.5px; display: flex; gap: 6px; align-items: center; width: 100%; }
.x.list .item { display: flex; align-items: center; gap: 4px; }
.x.list .bullet { opacity: .7; font-size: 11px; }
.x .f { height: 20px; font-size: 12px; }
.x .clear { background: rgba(0,0,0,.25); border: none; color: #fff; width: 16px; height: 16px; border-radius: 50%; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; margin-left: 2px; }
.x .clear:hover { background: var(--err); }
/* Nested controls appear on hover or keyboard focus to keep deep formulas readable;
   the picker and the step menu remain the always-visible paths. */
.x .clear, .x .fx { display: none; }
.x:hover > .clear, .x:focus-within > .clear, .x .listhead .clear, .x .item > .clear,
.holder:hover > .fx, .holder:focus-within > .fx { display: inline-block; }
.x.list .listhead .clear { display: none; }
.x.list:hover .listhead .clear, .x.list:focus-within .listhead .clear { display: inline-block; }
.x.grab { cursor: grab; }
.x.flag::after { content: "!"; position: absolute; top: -6px; right: -4px; background: var(--err); color: #fff; width: 15px; height: 15px; border-radius: 50%; font: 700 10px/15px var(--font-ui); text-align: center; }
.x.test.flag { outline: 2px solid var(--err); }

/* ---------- picker popover ---------- */
.picker { position: absolute; z-index: 60; width: 380px; max-width: calc(100vw - 32px); max-height: 470px; display: flex; flex-direction: column; background: var(--dlg); border: 1px solid var(--gold); border-radius: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.6); }
.picker .ph { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.picker .ph .t { font: 600 13px var(--font-head); display: flex; align-items: center; gap: 8px; }
.picker .ph .t .kind { font: 500 10px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; border-radius: 3px; background: var(--panel); color: var(--dim); }
.picker .ph p { margin: 4px 0 8px; color: var(--dim); font-size: 12px; line-height: 1.4; }
.picker .ph input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
.picker .pb { overflow-y: auto; padding: 6px 6px 10px; }
.picker .grp { font: 600 12.5px var(--font-head); color: var(--gold); padding: 10px 6px 3px; display: flex; flex-direction: column; gap: 1px; }
.picker .grp .gd { font: 400 11.5px var(--font-ui); color: var(--dim); }
.picker .ph p.who { background: var(--panel); border-radius: 4px; padding: 6px 8px; color: var(--fg); }
.picker .ph p.who b { color: var(--gold); font-weight: 600; }
.picker .opt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: none; padding: 5px 6px; border-radius: 4px; cursor: pointer; }
.picker .opt:hover, .picker .opt:focus-visible { background: var(--panel); }
.picker .opt .chip { flex: none; display: inline-block; padding: 2px 9px; color: #fff; font-size: 11.5px; background: var(--c-num); border-radius: 999px; }
.picker .opt .chip.test { background: var(--c-test); border-radius: 0; clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 7px 100%, 0 50%); padding: 2px 12px; }
.picker .opt .chip.ex { background: var(--panel); color: var(--fg); border-radius: 3px; font-family: var(--font-mono); font-size: 11px; }
.picker .opt.more { color: var(--gold); font-size: 12px; padding-left: 10px; }
.picker .opt .d { color: var(--dim); font-size: 11.5px; line-height: 1.3; }
.picker .typebox { border-top: 1px solid var(--line); padding: 8px 12px 10px; }
.picker .typebox summary { cursor: pointer; color: var(--dim); font-size: 12px; }
.picker .typebox textarea { width: 100%; margin-top: 6px; min-height: 48px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px; font: 12px var(--font-mono); font-variant-ligatures: none; }
.picker .typebox .res { font-size: 11.5px; margin: 4px 0; color: var(--dim); }
.picker .typebox .res.bad { color: var(--err); }

.menu { position: absolute; z-index: 60; background: var(--dlg); border: 1px solid var(--line); border-radius: 5px; padding: 4px; min-width: 190px; box-shadow: 0 10px 24px rgba(0,0,0,.55); }
.menu button { display: flex; width: 100%; gap: 8px; align-items: center; background: none; border: none; text-align: left; padding: 6px 8px; border-radius: 3px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--panel); }
.menu .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.menu .mh { font: 600 10.5px var(--font-head); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); padding: 6px 8px 2px; }
.menu .md { color: var(--dim); font-size: 11.5px; }

/* ---------- ability card (Draw Steel layout) ---------- */
.card { background: var(--card-bg); color: var(--card-fg); border-radius: 4px; padding: 14px 16px; font: 14px/1.4 var(--font-card); }
.card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.card h2 { font: 700 19px var(--font-card); margin: 0; }
.card .act { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.card .kw { font-style: italic; color: #5d5140; margin: 2px 0 8px; }
.card .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; border-top: 1px solid var(--card-rule); border-bottom: 1px solid var(--card-rule); padding: 6px 0; margin-bottom: 8px; font-size: 13.5px; }
.card .grid b { font-weight: 700; }
.card .pr { font-weight: 700; margin: 6px 0 4px; }
.card .tier { display: grid; grid-template-columns: 52px 1fr; gap: 6px; padding: 2px 0; }
.card .tier .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.card .eff { margin-top: 8px; }
.card .req { margin-top: 8px; font-size: 13px; color: #5d5140; }
.card .formula { border-bottom: 1px dotted #8a7650; }
.status { display: flex; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; line-height: 1.4; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; flex: none; }
.status.ok .dot { background: var(--ok); } .status.bad .dot { background: var(--err); }
.problems { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.problems li { font-size: 12px; padding: 5px 8px; background: var(--panel); border-left: 3px solid var(--err); line-height: 1.35; }
details.saved summary { cursor: pointer; color: var(--dim); font-size: 12px; }
details.saved pre { font: 11px var(--font-mono); font-variant-ligatures: none; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
.note { color: var(--dim); font-size: 12px; line-height: 1.5; margin: 0; }
#dragGhost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; opacity: .9; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
@media (prefers-reduced-motion: no-preference) { .flash { animation: fl .35s ease-out; } @keyframes fl { from { filter: brightness(1.6); } to { filter: none; } } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono&display=swap">

<div class="page">
<div class="dlg" id="dlg">
  <div class="dlg-head">
    <h1>Edit Ability</h1>
    <div class="seg" role="group" aria-label="Editor">
      <button aria-pressed="true" type="button">Simple</button>
      <button aria-pressed="false" type="button" title="The existing full editor (not part of this prototype)">Full editor</button>
    </div>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="showGs"> Show GoblinScript</label>
    <label for="exSel" class="note">Open</label>
    <select id="exSel" class="btn">
      <option value="gouge">Gouge (hero strike)</option>
      <option value="cleave">Reaving Cleave (loaded from existing formulas)</option>
      <option value="smoke">Smoke Bomb (has an advanced step)</option>
      <option value="blank">New ability</option>
    </select>
  </div>
  <div class="dlg-body">
    <div class="main" id="main"></div>
    <div class="side" id="side"></div>
  </div>
</div>
</div>
<div id="dragGhost"></div>

<script>
"use strict";
/* =====================================================================
   Formula field descriptions. These mirror the `documentation` objects the
   real editor passes to gui.GoblinScriptInput (AbilityEditor.lua _rangeDocs,
   _numTargetsDocs, _targetFilterDocs, _abilityFilterDocs...). The picker is
   generated from them, so each slot only offers what is valid there.
   ===================================================================== */
const NUM_FIELDS = ["Level","Might","Agility","Reason","Intuition","Presence","Highest Characteristic","Stamina","Maximum Stamina","Recoveries Available to Spend","Heroic Resources Available to Spend","Walking Speed","Size","Reach","Moved This Turn","Combat Round"];
// Friendlier wording for stats on the card; the dropdowns keep the real GoblinScript names.
const FIELD_PROSE = { "Heroic Resources Available to Spend": "Heroic Resource", "Recoveries Available to Spend": "Recoveries", "Combat Round": "round number", "Maximum Stamina": "maximum Stamina" };
const BOOL_FIELDS = { "Minion": "a minion", "Hero": "a hero", "Flanked": "flanked", "Dying": "dying", "Concealed": "concealed", "Your Turn": "taking their turn" };
const CONDITIONS = ["Bleeding","Dazed","Frightened","Grabbed","Prone","Restrained","Slowed","Taunted","Weakened"];
const YOU = { label: "You", prefix: "", prose: "you", poss: "your", aliases: ["self"] };
const CASTER = { label: "Caster", prefix: "Caster.", prose: "the caster", poss: "the caster's", aliases: ["caster"] };
const TARGET_SUBJ = { label: "Target", prefix: "", prose: "the target", poss: "the target's", aliases: ["self", "target"] };
const TARGET_SYM = { label: "Target", prefix: "Target.", prose: "the target", poss: "the target's", aliases: ["target"] };
const CHARGES = { name: "Charges", type: "number", desc: "Charges left on this ability.", prose: "the charges left" };
const DOCS = {
  range: { who: "Worked out for you, the creature using the ability.", defaultRole: "You", title: "Range", output: "number", help: "The range of this ability in squares. If left empty the ability has a range of 1 (melee).",
    roles: [YOU], symbols: [CHARGES],
    examples: [["10", "The ability has a range of 10 squares."], ["10 + Level * 2", "10 squares, plus 2 per level."]] },
  numTargets: { who: "Worked out for you, the creature using the ability.", defaultRole: "You", title: "Number of targets", output: "number", help: "The number of targets this ability can select.",
    roles: [YOU], symbols: [CHARGES],
    examples: [["3", "The ability targets 3 creatures."], ["1 + 1 when Level >= 5", "One target, or two from level 5."]] },
  cost: { who: "Worked out for you, the creature using the ability.", defaultRole: "You", title: "Cost", output: "number", help: "How many of the selected resource this ability costs. Usually a flat number.",
    roles: [YOU], symbols: [], examples: [["3", "Costs 3."]] },
  targetFilter: { who: "Checked once for each creature in the area. \u201cThe target\u201d is the creature being checked; \u201cthe caster\u201d is you.", defaultRole: "Target", title: "Who is affected", output: "boolean", help: "Decides whether each creature in the area is affected. Checked once per creature. Leave empty to affect every creature.",
    roles: [TARGET_SUBJ, CASTER],
    symbols: [{ name: "Enemy", type: "boolean", desc: "The creature is an enemy of the caster.", prose: "the target is an enemy" },
              { name: "Target Number", type: "number", desc: "1 for the first target, 2 for the second, and so on.", prose: "its target number" },
              { name: "Number of Targets", type: "number", desc: "How many creatures the ability is targeting.", prose: "the number of targets" }],
    examples: [["Enemy", "Only enemies of the caster."], ["not Enemy", "Only allies and yourself."], ["Target Number = 2", "Only the second target."]] },
  requirement: { who: "Checked against you, the creature using the ability, before it is used.", defaultRole: "You", title: "Can be used when", output: "boolean", help: "Decides whether the ability can be used at all. Checked against you. If false, the reason text is shown to the player.",
    roles: [YOU], symbols: [], examples: [["Level >= 5", "Only at level 5 or higher."], ["Stamina <= Maximum Stamina / 2", "Only while you are winded."]] },
  stepIf: { who: "Checked once for each target. \u201cThe target\u201d is the creature being checked; \u201cyou\u201d is the creature using the ability.", defaultRole: "Target", title: "Only if", output: "boolean", help: "The steps inside only happen to targets for which this is true. Checked once per target.",
    roles: [TARGET_SYM, YOU], symbols: [{ name: "Enemy", type: "boolean", desc: "The target is an enemy of yours.", prose: "the target is an enemy" }],
    examples: [['Target.Conditions has "Prone"', "Only targets that are prone."], ["Target.Stamina <= Target.MaximumStamina / 2", "Only winded targets."]] },
  damage: { who: "Worked out for you, the creature using the ability.", defaultRole: "You", title: "Damage", output: "roll", help: "How much damage is dealt. Can use dice.",
    roles: [YOU, TARGET_SYM], symbols: [], examples: [["2d6 + Might", "2d6 plus your Might."], ["Might * 2", "Twice your Might."]] },
  tierDamage: { who: "Worked out for you, the creature using the ability.", defaultRole: "You", title: "Tier damage", output: "roll", help: "Damage for this tier of the power roll. Usually a flat number, or a number plus a characteristic.",
    roles: [YOU], symbols: [], examples: [["3 + Might", "3 plus your Might."]] },
  heal: { who: "Worked out for you, the creature using the ability.", defaultRole: "You", title: "Healing", output: "roll", help: "How much Stamina the target regains.",
    roles: [YOU, TARGET_SYM], symbols: [], examples: [["Recovery Value", "One recovery's worth."]] },
};
const ACTIONS = ["Main action","Maneuver","Triggered action","Free triggered action","Free maneuver","No action"];

      item("[ any number ] is at least [ ]", "Pick any stat or formula on either side.", () => X("compare", { op: ">=" }, { a: numH("0"), b: numH("1") }), "compare greater less equal", true),
    ]]);

    groups.push(["Scale with level", "Grows as the creature levels up.", [

        b: Object.assign(numH(), { expr: X("pick", {}, { a: numH("1"), cond: Object.assign(H("boolean", h.docs), { expr: X("compare", { op: ">=" }, { a: Object.assign(numH(), { expr: X("stat", { role: who, field: "Level" }) }), b: numH("5") }) }), b: numH("0") }) }) }), "echelon bonus"),
      item("[ ] plus " + (r0.label === "You" ? "your" : r0.poss) + " Level", "Goes up by one every level.", () => X("math", { op: "+" }, { a: numH(h.lit || "1"), b: Object.assign(numH(), { expr: X("stat", { role: who, field: "Level" }) }) }), "per level"),

      item("Half of [ ]", "Division rounds down.", () => X("math", { op: "/" }, { a: numH(h.lit || "1"), b: numH("2") }), "divide half"),
      item("[ ] if [test], otherwise [ ]", "Pick one of two values.", () => X("pick", {}, { a: numH("2"), cond: H("boolean", h.docs), b: numH(h.lit || "1") }), "when else choose"),

}
function openPicker(h, anchor) {
  closePopups();
  const d = DOCS[h.docs];
  const p = E("div", "picker"); p.setAttribute("role", "dialog"); p.setAttribute("aria-label", "Choose a block for " + d.title);
  p.addEventListener("click", ev => ev.stopPropagation());
  const ph = E("div", "ph");
  const t = E("div", "t", d.title); t.appendChild(E("span", "kind", h.kind === "boolean" ? "true / false" : h.kind === "roll" ? "number or dice" : "number")); ph.appendChild(t);
  ph.appendChild(E("p", null, d.help));
  const whoP = E("p", "who"); whoP.innerHTML = "<b>Who:</b> " + esc(d.who); ph.appendChild(whoP);
  const search = E("input"); search.placeholder = h.kind === "boolean" ? "What do you want to check? e.g. prone, winded, level" : "What should this be based on? e.g. level, might"; search.setAttribute("aria-label", "Search blocks"); ph.appendChild(search);
  p.appendChild(ph);
  const pb = E("div", "pb"); p.appendChild(pb);
  const groups = pickerOptions(h);
  // Without a search, each intent shows its first few choices so every intent stays visible.
  const expanded = new Set();
  const draw = () => {
    pb.innerHTML = ""; const q = norm(search.value);
    let n = 0;
    for (const [g, gd, opts] of groups) {
      const vis = opts.filter(o => !q || norm(g + " " + o.chip.txt + " " + (o.d || "") + " " + (o.key || "")).includes(q));
      if (!vis.length) continue;
      const gh = E("div", "grp", g); gh.appendChild(E("span", "gd", gd)); pb.appendChild(gh);
      const cap4 = !q && !expanded.has(g) && vis.length > 4;
      for (const o of cap4 ? vis.slice(0, 3) : vis) {
        const b = E("button", "opt"); b.type = "button";
        b.appendChild(E("span", "chip" + (o.chip.ex ? " ex" : o.chip.test ? " test" : ""), o.chip.txt));
        if (o.d) b.appendChild(E("span", "d", o.d));
        b.addEventListener("click", () => { h.expr = o.make(); refresh(); flash(h.id); });
        pb.appendChild(b); n++;
      }
      if (cap4) { const more = E("button", "opt more", "Show " + (vis.length - 3) + " more"); more.type = "button";
        more.addEventListener("click", () => { expanded.add(g); draw(); }); pb.appendChild(more); }
    }
    if (!n) pb.appendChild(E("p", "note", "Nothing matches. You can type a formula below."));
  };
  search.addEventListener("input", draw);
  draw();
  const tb = E("details", "typebox"); tb.appendChild(E("summary", null, "Type a formula instead"));
  const ta = E("textarea"); ta.spellcheck = false; ta.setAttribute("aria-label", "GoblinScript formula"); ta.value = h.expr ? cHolder(h).s : "";
  const res = E("div", "res"); const ins = E("button", "btn", "Use this formula"); ins.type = "button";
  const check = () => {
    const s = ta.value.trim(); if (!s) { res.textContent = ""; res.className = "res"; return; }
    try { const a = parseGS(s); const x = astToX(a, h.kind === "boolean", h.docs); const rawCount = JSON.stringify(x).split('"raw"').length - 1;
      res.className = "res"; res.textContent = rawCount ? "Understood. " + rawCount + " part" + (rawCount > 1 ? "s" : "") + " will stay as typed formula." : "Understood. Becomes blocks: " + cX(x, h).prose; }
    catch (e) { res.className = "res bad"; res.textContent = e.message; }
  };
  ta.addEventListener("input", check); check();
  ins.addEventListener("click", () => { const nh = holderFromText(h.kind, h.docs, ta.value); h.expr = nh.expr; if (!nh.expr) h.lit = nh.lit; refresh(); flash(h.id); });
  tb.appendChild(ta); tb.appendChild(res); tb.appendChild(ins); p.appendChild(tb);
  place(p, anchor);
  search.focus();
}
function flash(hid) { const e = main.querySelector('[data-holder="' + hid + '"]'); if (e) { e.classList.add("flash"); setTimeout(() => e.classList.remove("flash"), 400); } }

/* Only steps that can be stored in this place are offered: tiers get tier-text steps only. */
function addMenu(list, ctx, anchor) {

function stepMenu(st, list, ctx, anchor) {
  closePopups();
  const m = E("div", "menu"); m.addEventListener("click", ev => ev.stopPropagation());
  const i = list.indexOf(st);
  const item = (t, fn, dis) => { const b = E("button", null, t); b.type = "button"; if (dis) b.disabled = true, b.style.opacity = .4; else b.addEventListener("click", () => { fn(); refresh(); }); m.appendChild(b); };
  item("Move up", () => { list.splice(i, 1); list.splice(i - 1, 0, st); }, i === 0);
  item("Move down", () => { list.splice(i, 1); list.splice(i + 1, 0, st); }, i === list.length - 1);
  if (ctx === "main" && st.type !== "ifStep") item("Wrap in “Only if”", () => { const w = STEPS.ifStep.make(); w.branches.then.push(st); list.splice(i, 1, w); });
  if (ctx === "tier" && st.type !== "potency") item("Wrap in potency check", () => { const w = STEPS.potency.make(); w.branches.then.push(st); list.splice(i, 1, w); });
  if (st.branches && st.branches.then && st.branches.then.length) item("Unwrap (keep the steps inside)", () => { list.splice(i, 1, ...st.branches.then); });
  item("Duplicate", () => { list.splice(i + 1, 0, reid(JSON.parse(JSON.stringify(st)))); });

  m.querySelector("button:not([disabled])").focus();
}
function reid(o) { if (o && typeof o === "object") { if (o.id) o.id = o.id[0] + uid++; for (const k in o) reid(o[k]); } return o; }

/* =====================================================================
   Drag: steps by their handle (reorder, move between compatible lists);
   formula blocks by their body (move to another slot of the same kind).
   Every drag has a menu or picker alternative.
   ===================================================================== */
const ghost = document.getElementById("dragGhost");
let drag = null;
function findStep(id, lists) {
  for (const l of lists) for (const st of l) {
    if (st.id === id) return { st, list: l };
    for (const k in st.branches || {}) { const r = findStep(id, [st.branches[k]]); if (r) return r; }
  }
  return null;
}
function allHolders() {
  const out = {};
  const visitH = h => { if (!h) return; out[h.id] = h; if (h.expr) visitX(h.expr); };
  const visitX = x => { for (const k in x.kids) visitH(x.kids[k]); (x.f.items || []).forEach(visitH); };
  [ab.range, ab.numTargets, ab.cost, ab.targetFilter, ...ab.requirements.map(r => r.h)].forEach(visitH);
  const visitS = l => l.forEach(st => { for (const k in st.slots) visitH(st.slots[k]); for (const k in st.branches || {}) visitS(st.branches[k]); });
  visitS(ab.steps);
  return out;
}
document.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  const hd = ev.target.closest(".handle");
  const xe = !hd && ev.target.closest(".x");
  if (xe && ev.target.closest("input, select, button")) return;
  if (!hd && !xe) return;
  if (hd) {
    const r = findStep(hd.dataset.drag, [ab.steps]); if (!r) return;
    drag = { kind: "step", st: r.st, from: r.list, el: hd.closest(".step"), sx: ev.clientX, sy: ev.clientY };
  } else {
    const hs = allHolders(); const h = hs[xe.dataset.holderOf]; if (!h) return;
    drag = { kind: "x", h, x: h.expr, el: xe, sx: ev.clientX, sy: ev.clientY };
  }
  const r = drag.el.getBoundingClientRect(); drag.ox = ev.clientX - r.left; drag.oy = ev.clientY - r.top;
  ev.preventDefault();
});
document.addEventListener("pointermove", ev => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 5) return;
    drag.on = true; closePopups();
    ghost.innerHTML = ""; const c = drag.el.cloneNode(true); c.style.width = drag.el.offsetWidth + "px"; ghost.appendChild(c);
    drag.el.classList.add("ghost");
  }
  ghost.style.transform = "translate(" + (ev.clientX - drag.ox) + "px," + (ev.clientY - drag.oy) + "px)";
  main.querySelectorAll(".drop-line").forEach(l => l.remove());
  main.querySelectorAll(".holder.hot").forEach(l => l.classList.remove("hot"));
  drag.target = null;
  if (drag.kind === "step") {
    const ctxOk = c => STEPS[drag.st.type].ctx.includes(c);
    let best = null;
    main.querySelectorAll(".stack[data-list]").forEach(s => {
      if (drag.el.contains(s) || !ctxOk(s.dataset.ctx)) return;
      const r = s.getBoundingClientRect();
      if (ev.clientX < r.left - 10 || ev.clientX > r.right + 10 || ev.clientY < r.top - 12 || ev.clientY > r.bottom + 12) return;
      if (!best || best.r.width > r.width) best = { s, r };
    });
    if (best) {
      const kids = [...best.s.children].filter(k => k.classList.contains("step"));
      let idx = kids.length;
      for (let i = 0; i < kids.length; i++) { const r = kids[i].getBoundingClientRect(); if (ev.clientY < r.top + Math.min(r.height / 2, 20)) { idx = i; break; } }
      const line = E("div", "drop-line"); best.s.insertBefore(line, kids[idx] || best.s.querySelector(".addrow"));
      drag.target = { list: listsById[best.s.dataset.list], idx };
    }
  } else {
    let best = null;
    main.querySelectorAll(".holder").forEach(he => {
      if (drag.el.contains(he)) return;
      const h = allHolders()[he.dataset.holder]; if (!h || h === drag.h) return;
      if ((h.kind === "boolean") !== (drag.h.kind === "boolean")) return;
      const r = he.getBoundingClientRect();
      if (ev.clientX >= r.left - 4 && ev.clientX <= r.right + 4 && ev.clientY >= r.top - 4 && ev.clientY <= r.bottom + 4) { if (!best || best.a > r.width * r.height) best = { he, h, a: r.width * r.height }; }
    });
    if (best) { best.he.classList.add("hot"); drag.target = best.h; }
  }
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null; ghost.innerHTML = "";
  if (!d.on) return;
  if (d.kind === "step" && d.target) {
    const fromIdx = d.from.indexOf(d.st);
    let idx = d.target.idx;
    if (d.target.list === d.from && idx > fromIdx) idx--;
    d.from.splice(fromIdx, 1); d.target.list.splice(idx, 0, d.st);
  } else if (d.kind === "x" && d.target) {
    const old = d.target.expr; d.target.expr = d.x; d.h.expr = old || null;
    if (d.x.type === "dice" && d.target.kind !== "roll") { d.h.expr = d.x; d.target.expr = old; }
  }
  refresh();
});

function newAbility() {
  return { name: "New Ability", action: "Main action", keywords: "Melee, Strike, Weapon", resource: "no cost",
    cost: H("number", "cost", "1"), numTargets: H("number", "numTargets", "1"), targetCount: "creature", distance: "Melee", range: H("number", "range", "1"),
    targetFilter: H("boolean", "targetFilter"), requirements: [], steps: [] };
}

  blank: newAbility,
  gouge: () => {
    const a = newAbility();
    Object.assign(a, { name: "Gouge", keywords: "Melee, Strike, Weapon" });

    const dmg = (n, f) => { const s = STEPS.damage.make("tier"); s.slots.amount = holderFromText("roll", "tierDamage", n); return s; };
    pr.branches.t1.push(dmg("3 + Might")); pr.branches.t2.push(dmg("6 + Might"));

      aura: { __typeName: "Aura", name: "Smoke Cloud", applyto: "enemies", damage: 0, difficult_terrain: false, concealment: true } });
    const cond = STEPS.condition.make(); cond.f.cond = "Dazed"; cond.f.dur = "EoT";

    a.steps.push(aura, onlyIf);

  },

    // Stored text exactly as it would appear in compendium YAML.

      reasonedFilters: [{ formula: "Heroic Resources Available to Spend >= 3 or Combat Round >= 3", reason: "You need 3 Ferocity, or it must be round 3 or later." }],
      tiers: ["5 + Might", "8 + Might", "11 + Might"], resourceNumber: "3" };

    a.cost = holderFromText("number", "cost", saved.resourceNumber);
    a.numTargets = holderFromText("number", "numTargets", saved.numTargets);
    a.range = holderFromText("number", "range", saved.range);
    a.targetFilter = holderFromText("boolean", "targetFilter", saved.targetFilter);
    a.requirements = saved.reasonedFilters.map(r => ({ h: holderFromText("boolean", "requirement", r.formula), reason: r.reason }));
    const pr = STEPS.powerRoll.make();
    ["t1", "t2", "t3"].forEach((k, i) => { const s = STEPS.damage.make("tier"); s.slots.amount = holderFromText("roll", "tierDamage", saved.tiers[i]); pr.branches[k].push(s); });
    const fm = STEPS.forced.make(); fm.f.n = "1"; pr.branches.t3.push(fm);
    a.steps.push(pr);

  },
};
document.getElementById("exSel").addEventListener("change", e => { ab = EXAMPLES[e.target.value](); refresh(); });
